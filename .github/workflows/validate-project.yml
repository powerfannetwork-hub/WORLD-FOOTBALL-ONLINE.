name: Validate GDevelop project

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check project
        run: |
          python -c "import json; json.load(open('game.json')); print('JSON VALID')"
